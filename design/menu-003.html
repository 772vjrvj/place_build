<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MENU-003 버튼권한관리</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Pretendard', sans-serif;
        }

        body{
            background:#f3f4f6;
            padding:20px;
        }

        .wrapper{
            background:white;
            border:1px solid #dcdfe6;
            border-radius:10px;
            overflow:hidden;
        }

        /* HEADER */
        .page-title{
            padding:18px 24px;
            border-bottom:1px solid #e5e7eb;
            font-size:28px;
            font-weight:700;
            color:#111827;
        }

        .page-title span{
            font-size:14px;
            background:#e8f0ff;
            color:#2563eb;
            padding:4px 10px;
            border-radius:6px;
            margin-left:10px;
        }

        /* CONTENT */
        .content{
            display:flex;
            min-height:700px;
        }

        /* SIDEBAR */
        .sidebar{
            width:240px;
            background:linear-gradient(180deg,#111827 0%, #0f172a 100%);
            color:white;
            padding:20px 0;
        }

        .sidebar-title{
            font-size:24px;
            font-weight:700;
            padding:0 24px 20px;
        }

        .menu{
            list-style:none;
        }

        .menu li{
            padding:16px 24px;
            color:#cbd5e1;
            border-left:4px solid transparent;
            cursor:pointer;
            transition:all .2s;
        }

        .menu li:hover{
            background:rgba(255,255,255,0.06);
        }

        .menu li.active{
            background:rgba(37,99,235,0.2);
            border-left:4px solid #3b82f6;
            color:white;
            font-weight:600;
        }

        /* MAIN */
        .main{
            flex:1;
            background:#f8fafc;
            padding:24px;
        }

        .breadcrumb{
            font-size:14px;
            color:#6b7280;
            margin-bottom:20px;
        }

        /* SEARCH */
        .search-box{
            background:white;
            border:1px solid #e5e7eb;
            border-radius:10px;
            padding:20px;
            margin-bottom:20px;
        }

        .search-row{
            display:flex;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }

        .search-row label{
            font-size:14px;
            font-weight:600;
            color:#374151;
        }

        .select{
            width:180px;
            height:40px;
            border:1px solid #d1d5db;
            border-radius:6px;
            padding:0 12px;
            background:white;
        }

        .btn{
            height:40px;
            padding:0 18px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:600;
        }

        .btn-search{
            background:#2563eb;
            color:white;
        }

        /* TABLE */
        .table-wrapper{
            background:white;
            border:1px solid #e5e7eb;
            border-radius:10px;
            overflow:hidden;
        }

        .table-top{
            display:flex;
            justify-content:flex-end;
            align-items:center;
            padding:16px 20px;
            border-bottom:1px solid #e5e7eb;
            background:#f8fafc;
        }

        .save-btn{
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            padding:10px 18px;
            cursor:pointer;
            font-weight:600;
        }

        .table{
            width:100%;
            border-collapse:collapse;
        }

        .table thead{
            background:#f8fafc;
        }

        .table th{
            padding:14px;
            border-bottom:1px solid #e5e7eb;
            border-right:1px solid #eef2f7;
            color:#374151;
            font-size:14px;
        }

        .table td{
            padding:14px;
            border-bottom:1px solid #eef2f7;
            border-right:1px solid #eef2f7;
            text-align:center;
            font-size:14px;
            color:#4b5563;
        }

        .table tr:hover{
            background:#f9fafb;
        }

        .status-use{
            color:#16a34a;
            font-weight:600;
        }

        .status-none{
            color:#9ca3af;
            font-weight:600;
        }

        input[type='checkbox']{
            width:16px;
            height:16px;
            accent-color:#2563eb;
        }
    </style>

</head>

<body>

<div class="wrapper">

    <!-- TITLE -->
    <div class="page-title">
        3. 버튼권한관리
        <span>MENU-003</span>
    </div>

    <div class="content">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <div class="sidebar-title">
                메뉴관리
            </div>

            <ul class="menu">
                <li onclick="location.href='menu-001.html'">메뉴목록</li>
                <li onclick="location.href='menu-002.html'">ROLE 메뉴권한</li>
                <li onclick="location.href='menu-003.html'" class="active" >버튼권한관리</li>
                <li onclick="location.href='menu-005.html'" >요금제 메뉴정책</li>
                <li onclick="location.href='menu-006.html'">업체별 메뉴정책</li>
            </ul>

        </div>

        <!-- MAIN -->
        <div class="main">

            <div class="breadcrumb">
                메뉴관리 > 버튼권한관리
            </div>

            <!-- SEARCH -->
            <div class="search-box">

                <div class="search-row">

                    <label>메뉴</label>

                    <select class="select">
                        <option>계약정보</option>
                    </select>

                    <label>역할</label>

                    <select class="select">
                        <option>MANAGER</option>
                        <option>USER</option>
                    </select>

                    <label>사용여부</label>

                    <select class="select">
                        <option>전체</option>
                        <option>Y</option>
                        <option>N</option>
                    </select>

                    <button class="btn btn-search">
                        검색
                    </button>

                </div>

            </div>

            <!-- TABLE -->
            <div class="table-wrapper">

                <div class="table-top">

                    <button class="save-btn">
                        저장
                    </button>

                </div>

                <table class="table">

                    <thead>
                    <tr>
                        <th>기능사용</th>
                        <th>버튼코드</th>
                        <th>버튼명</th>
                        <th>설명</th>
                        <th>사용여부</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr>
                        <td>
                            <input type="checkbox" checked />
                        </td>
                        <td>SAVE_BTN</td>
                        <td>저장</td>
                        <td>데이터 저장</td>
                        <td class="status-use">사용</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" checked />
                        </td>
                        <td>DELETE_BTN</td>
                        <td>삭제</td>
                        <td>데이터 삭제</td>
                        <td class="status-use">사용</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" />
                        </td>
                        <td>EXCEL_BTN</td>
                        <td>엑셀다운로드</td>
                        <td>엑셀 다운로드</td>
                        <td class="status-none">미사용</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" checked />
                        </td>
                        <td>SETTING_BTN</td>
                        <td>설정</td>
                        <td>설정 화면 이동</td>
                        <td class="status-use">사용</td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" />
                        </td>
                        <td>UNUSE_BTN</td>
                        <td>사용안함</td>
                        <td>사용안함</td>
                        <td class="status-none">미사용</td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
