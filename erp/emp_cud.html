<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>직원 등록 - 인사관리</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Pretendard', sans-serif; }
        body { background:#f5f7fb; display:flex; }
        .sidebar { width:260px; height:100vh; background:linear-gradient(180deg,#071325,#08192f,#06101e); color:#fff; padding:20px 15px; position:fixed; left:0; top:0; }
        .main-content { margin-left:260px; flex:1; padding:40px; display:flex; gap:30px; }
        .form-area { flex:2.5; }
        .helper-area { flex:1; background:#fff; border-radius:15px; padding:25px; box-shadow:0 4px 20px rgba(0,0,0,0.05); height:fit-content; }
        .card { background:#fff; border-radius:15px; padding:35px; box-shadow:0 4px 20px rgba(0,0,0,0.05); }
        .row { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px; }
        label { display:block; margin-bottom:8px; font-weight:700; color:#374151; font-size:14px; }
        input, select, textarea { width:100%; padding:12px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px; }
        .btn-submit { background:#2563eb; color:#fff; border:none; padding:18px; border-radius:10px; font-weight:700; width:100%; cursor:pointer; margin-top:10px; font-size:16px; }
        .emp-item { padding:12px; border-bottom:1px solid #f9fafb; cursor:pointer; font-size:13px; transition: 0.2s; }
        .emp-item:hover { background:#f0f7ff; color:#2563eb; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="font-size:24px; font-weight:700; margin-bottom:40px;">인사관리 ERP</div>
        <nav>
            <a href="emp_list.html" style="color:#a3b1c6; text-decoration:none; display:flex; padding:12px 15px;"><i class="fa-solid fa-users" style="margin-right:12px;"></i> 직원 목록</a>
            <a href="emp_reg.html" style="background:#1a2b45; color:#fff; text-decoration:none; display:flex; padding:12px 15px; border-radius:10px;"><i class="fa-solid fa-user-plus" style="margin-right:12px;"></i> 직원 등록</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="form-area">
            <h2 style="margin-bottom:25px;">직원 정보 등록/수정</h2>
            <div class="card">
                <form>
                    <div class="row">
                        <div><label>직원 ID (EMP_ID) *</label><input type="text" placeholder="사번 또는 아이디"></div>
                        <div><label>성명 (EMP_NAME) *</label><input type="text" placeholder="성명 입력"></div>
                    </div>
                    <div class="row">
                        <div><label>권한 (ROLES) *</label><select><option>USER</option><option>LEADER</option><option>ADMIN</option></select></div>
                        <div><label>등록일 (CREATE_DT) *</label><input type="date"></div>
                    </div>
                    <div class="row">
                        <div><label>비밀번호 *</label><input type="password" placeholder="비밀번호 설정"></div>
                        <div><label>비밀번호 수정일 (PWD_CHG_DT)</label><input type="date"></div>
                    </div>
                    <div class="row">
                        <div><label>상급자 ID (UPPER_EMP_ID)</label><input type="text" id="target_upper" placeholder="우측에서 선택하세요"></div>
                        <div><label>부서 (DEPT_ID)</label><select><option>운영본부</option><option>개발팀</option></select></div>
                    </div>
                    <div class="row" style="grid-template-columns: 1fr 1fr 1fr;">
                        <div><label>사용여부 (USE_YN)</label><select><option>Y</option><option>N</option></select></div>
                        <div><label>탈퇴여부 (EXIT_YN)</label><select><option>N</option><option>Y</option></select></div>
                        <div><label>수정일 (UPDATE_DT)</label><input type="date"></div>
                    </div>
                    <div class="row">
                        <div style="grid-column: span 2;">
                            <label>탈퇴날짜 (EXIT_DT)</label>
                            <input type="datetime-local">
                        </div>
                    </div>
                    <div>
                        <label>상세 설명 (DESCRIPTION)</label>
                        <textarea style="height:100px; resize:none;" placeholder="직원 특이사항 및 비고 입력"></textarea>
                    </div>
                    <button type="submit" class="btn-submit">저장 및 업데이트</button>
                </form>
            </div>
        </div>
        <div class="helper-area">
            <h4 style="border-bottom:2px solid #2563eb; padding-bottom:10px; margin-bottom:15px;"><i class="fa-solid fa-search"></i> 상급자 선택 목록</h4>
            <div class="emp-item" onclick="document.getElementById('target_upper').value='master_01'"><b>master_01</b> 김관리 (MASTER)</div>
            <div class="emp-item" onclick="document.getElementById('target_upper').value='leader_02'"><b>leader_02</b> 이팀장 (LEADER)</div>
        </div>
    </div>
</body>
</html>
